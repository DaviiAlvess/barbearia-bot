# Coloque em /etc/nginx/sites-available/barbearia e troque o domínio.
# Depois: ln -s /etc/nginx/sites-available/barbearia /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#         certbot --nginx -d barbearia.seudominio.com.br
server {
    listen 80;
    server_name barbearia.seudominio.com.br;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
