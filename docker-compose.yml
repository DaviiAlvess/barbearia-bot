# Sobe tudo com: docker compose up -d
# Para ver o QR code na primeira vez: docker compose logs -f whatsapp
# Os limites de memória (mem_limit) protegem outros projetos na mesma VPS.
# Em VPS compartilhada, prefira Docker rootless do usuário "barbearia"
# (veja deploy/README.md) — mem_limit exige cgroup delegado (setup-rootless.sh).
name: barbearia-bot
services:
  whatsapp:
    build: ./servidor-whatsapp
    restart: unless-stopped
    environment:
      - ID_SESSAO=${ID_SESSAO:-8113}
    volumes:
      - sessao-whatsapp:/app/.wwebjs_auth   # guarda o login (não precisa ler o QR de novo)
    mem_limit: 1g
    shm_size: 256m   # o Chromium precisa de memória compartilhada

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVIDOR_WHATSAPP=http://whatsapp:3000
    volumes:
      - dados:/app/dados
    depends_on:
      - whatsapp
    mem_limit: 384m

  painel:
    build: .
    restart: unless-stopped
    command: uvicorn painel:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      # para a página /whatsapp buscar o QR no container do Node
      - SERVIDOR_WHATSAPP=http://whatsapp:3000
    ports:
      # só a própria VPS acessa; use Nginx (subdomínio) ou túnel SSH para abrir de fora
      - "127.0.0.1:${PAINEL_PORTA:-8080}:8080"
    volumes:
      - dados:/app/dados
    depends_on:
      - whatsapp
    mem_limit: 256m

volumes:
  sessao-whatsapp:
  dados:
