# Sobe tudo com: docker compose up -d
# QR code: abra o painel → /whatsapp
# Os limites de memória (mem_limit) protegem outros projetos na mesma VPS.
# Em VPS compartilhada, prefira Docker rootless do usuário "barbearia"
# (veja deploy/README.md) — mem_limit exige cgroup delegado (setup-rootless.sh).
name: barbearia-bot
services:
  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:-evolution_local}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    expose:
      - "5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      - SERVER_URL=http://evolution:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LANGUAGE=pt-BR
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution_local}@evolution-db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=agendbarber
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_LABELS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - CONFIG_SESSION_PHONE_CLIENT=Agendbarber
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - DEL_INSTANCE=false
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances
    # Só rede interna do compose — não publica porta na VPS
    expose:
      - "8080"
    depends_on:
      evolution-db:
        condition: service_healthy
    mem_limit: 768m

  bot:
    build: .
    restart: unless-stopped
    command: uvicorn bot_whatsapp:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - EVOLUTION_URL=http://evolution:8080
      - EVOLUTION_WEBHOOK_URL=http://bot:8000/webhook
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-barbearia}
    volumes:
      - dados:/app/dados
    depends_on:
      - evolution
    expose:
      - "8000"
    mem_limit: 384m

  painel:
    build: .
    restart: unless-stopped
    command: uvicorn painel:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      - EVOLUTION_URL=http://evolution:8080
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-barbearia}
    ports:
      # Só localhost: o Caddy (site barbearia.condoorganize.com) faz o proxy.
      # Não usa os virtual hosts do Condo; porta padrão local 8080, na VPS use 8090.
      - "127.0.0.1:${PAINEL_PORTA:-8080}:8080"
    volumes:
      - dados:/app/dados
    depends_on:
      - evolution
    mem_limit: 256m

volumes:
  evolution_instances:
  evolution_pg:
  dados:
